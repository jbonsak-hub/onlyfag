<!doctype html>
<html lang="no">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statle – Geografi – Onlyfag</title><link rel="stylesheet" href="../assets/geography/statle.css"><script src="../assets/analytics.js" defer></script><script src="../assets/geography/statle.js" defer></script></head>
<body>
<main class="game" aria-label="Statle – finn delstatene">
  <div id="mapViewport" class="map-viewport">        <svg id="map" viewBox="0 0 900 550" aria-label="Klikkbart kart over USAs 50 delstater" role="group">
          <defs><filter id="hoverGlow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <g id="states"></g>
          <text class="inset-label" x="27" y="383">ALASKA</text><text class="inset-label" x="220" y="458">HAWAII</text>
          <g id="smallStates"></g>
          <g id="hintLayer" aria-hidden="true"></g>
          <g id="labelLayer" aria-hidden="true"></g>
        </svg></div>
  <aside class="game-panel" aria-label="Spillinformasjon og kontroller">
    <header class="panel-header"><a class="brand" href="../geografi.html"><span class="brand-mark">o.</span>onlyfag</a></header>
    <div class="target-block"><span class="game-title">STATLE</span><span id="targetVerb">Klar for en runde?</span><strong id="targetName">USAs 50 delstater</strong></div>
    <div class="stats"><div><span>Fullført</span><strong><span id="completed">0</span><small> / 50</small></strong></div><div><span>Tid</span><time id="elapsed">00:00</time></div><div><span>Feil</span><strong id="mistakes">0 feil</strong></div></div>
    <div class="progress-track"><i id="progressFill"></i></div>
    <div id="overlay" class="ready-actions"><button id="start" class="primary-button" disabled>Laster kart …</button><button id="demo" class="text-button" disabled>Se en eksempelrunde →</button></div>
    <div class="game-controls"><button id="pause" aria-label="Sett spillet på pause" disabled>Ⅱ</button><button id="restart" aria-label="Start en ny runde" disabled>↻ Ny runde</button><button id="skip" disabled>Hopp over →</button></div>
    <div id="pauseOverlay" class="pause-box" hidden><strong>Pause</strong><button id="resume" class="primary-button">Fortsett →</button></div>
    <p id="feedback" role="status" aria-live="polite">Klikk på staten som står over.</p>
    <div class="legend" aria-label="Fargekoder"><strong>Fargekoder</strong><span><i class="dot green"></i>≤ 5 s · ingen feil</span><span><i class="dot yellow"></i>≤ 10 s · maks 1 feil</span><span><i class="dot orange"></i>&gt; 10 s / 2 feil</span><span><i class="dot red"></i>3+ feil / hoppet over</span></div>
    <footer><a class="quiz-page-back" href="../geografi.html#verden-quiz">← Quizoversikt</a><span>Kart: U.S. Census Bureau, 2024.<br>Alaska og Hawaii er flyttet og skalert.</span></footer>
  </aside>
</main>
</body></html>
