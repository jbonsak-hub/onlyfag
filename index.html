<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyFag</title>
  <meta name="description" content="Ressurser og oppgaver i fysikk, geografi og naturfag.">
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #171717;
      --muted: #6b6b6b;
      --border: #e5e5e2;
      --accent: #1f5f4a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 80px 0 60px;
    }

    header {
      margin-bottom: 44px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .intro {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .subject {
      display: flex;
      min-height: 190px;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .subject:hover {
      transform: translateY(-3px);
      border-color: #b9b9b4;
    }

    .subject:focus-visible {
      outline: 3px solid rgba(31, 95, 74, 0.25);
      outline-offset: 3px;
    }

    .subject h2 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -0.025em;
    }

    .subject p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .arrow {
      margin-top: 28px;
      color: var(--accent);
      font-size: 1.3rem;
    }

    footer {
      margin-top: 42px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 720px) {
      main {
        padding-top: 48px;
      }

      .subjects {
        grid-template-columns: 1fr;
      }

      .subject {
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>OnlyFag</h1>
      
    </header>

    <section class="subjects" aria-label="Fag">
      <a class="subject" href="fysikk2.html">
        <div>
          <h2>Fysikk 2</h2>
          
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="subject" href="geografi.html">
        <div>
          <h2>Geografi</h2>
          
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="subject" href="naturfag.html">
        <div>
          <h2>Naturfag</h2>
          
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="subject" href="fysikk2.html#hurtigfaktorisering">
        <div>
          <h2>Matematikk</h2>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

    </section>
</main>
</body>
</html>
