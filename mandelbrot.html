<script id="engine-code">/* OnlyFag fractal engine. Original implementation of the equations cited in README.md. */
(function(root){
'use strict';
const STORAGE_BITS=1200, MIN_SPAN=1e-280;
function parse(s,p=STORAGE_BITS){
 s=String(s).trim();if(s.length>1600||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(s))throw Error('Ugyldig desimaltall');
 let [m,e='0']=s.toLowerCase().split('e'),neg=m[0]==='-';m=m.replace(/^[-+]/,'');let [a,b='']=m.split('.');let ex=Number(e)-b.length;
 if(!Number.isSafeInteger(ex)||Math.abs(ex)>1500)throw Error('Eksponenten er utenfor støttet område');
 let n=BigInt((a||'0')+b),scale=1n<<BigInt(p);n=ex>=0?n*10n**BigInt(ex)*scale:n*scale/10n**BigInt(-ex);return neg?-n:n;
}
function num(n,p=STORAGE_BITS){if(!n)return 0;let sign=n<0n?-1:1,a=n<0n?-n:n;let sh=Math.max(0,a.toString(2).length-53);return sign*Number(a>>BigInt(sh))*2**(sh-p);}
function decimal(n,p=STORAGE_BITS,digits=365){let neg=n<0n;if(neg)n=-n;const S=1n<<BigInt(p),q=(n*10n**BigInt(digits)+S/2n)/S,s=q.toString().padStart(digits+1,'0'),a=s.slice(0,-digits),b=s.slice(-digits).replace(/0+$/,'');return (neg&&q?'-':'')+a+(b?'.'+b:'');}
function precision(step){return Math.max(192,Math.ceil(-Math.log2(step))+96);}
function rescale(n,p){return n>>BigInt(STORAGE_BITS-p);}
function interior(x,y){const y2=y*y,u=x-.25,q=u*u+y2;return q*(q+u)<.25*y2-1e-16||(x+1)*(x+1)+y2<.0625-1e-16;}
function interiorRect(cx,cy,h){
 const x0=cx-h,x1=cx+h,y0=cy-h,y1=cy+h,ymax=Math.max(y0*y0,y1*y1),ymin=y0<=0&&y1>=0?0:Math.min(y0*y0,y1*y1);
 if(Math.max((x0+1)**2,(x1+1)**2)+ymax<.0625-1e-14)return true;
 const u0=x0-.25,u1=x1-.25,q0=(u0<=0&&u1>=0?0:Math.min(u0*u0,u1*u1))+ymin,q1=Math.max(u0*u0,u1*u1)+ymax;
 return Math.max(q0*(q0+u0),q0*(q1+u1),q1*(q0+u0),q1*(q1+u1))<.25*ymin-1e-14;
}
function smooth(n,r2){return n+1-Math.log2(.5*Math.log(r2));}
function direct(cr,ci,max,ship=false){
 if(!ship&&interior(cr,ci))return -1;
 let x=0,y=0,xx=0,yy=0;
 if(ship){for(let n=1;n<=max;n++){y=2*Math.abs(x*y)+ci;x=xx-yy+cr;xx=x*x;yy=y*y;if(xx+yy>256)return smooth(n,xx+yy);}}
 else {for(let n=1;n<=max;n++){y=2*x*y+ci;x=xx-yy+cr;xx=x*x;yy=y*y;if(xx+yy>256)return smooth(n,xx+yy);}}
 return -1;
}
function directJulia(zr,zi,max,cr,ci){
 let x=zr,y=zi,xx=x*x,yy=y*y;
 for(let n=1;n<=max;n++){y=2*x*y+ci;x=xx-yy+cr;xx=x*x;yy=y*y;if(xx+yy>256)return smooth(n,xx+yy);}
 return -1;
}

// Independent fixed-point path: also used to repair the last few glitch pixels.
function exact(cr,ci,max,p,ship=false){
 const pb=BigInt(p),S=1n<<pb,limit=256n*S;let x=0n,y=0n;
 for(let n=1;n<=max;n++){const xx=(x*x)>>pb,yy=(y*y)>>pb;let xy=(x*y)>>pb;if(ship&&xy<0n)xy=-xy;y=2n*xy+ci;x=xx-yy+cr;const r2=(x*x+y*y)>>pb;if(r2>limit)return smooth(n,num(r2,p));}return -1;
}
function checkedExact(cr,ci,max,p,ship){
 let previous=exact(rescale(cr,p),rescale(ci,p),max,p,ship);
 for(let q=Math.min(p+64,1152);q<=1152;q=Math.min(q+128,1152)){
  const current=exact(rescale(cr,q),rescale(ci,q),max,q,ship);
  if((previous<0&&current<0)||(previous>=0&&current>=0&&Math.abs(previous-current)<1e-7))return current;
  if(q===1152)break;previous=current;
 }return NaN;
}
function reference(cr,ci,max,p,ship=false,radius=0,bla=true){
 const pb=BigInt(p),S=1n<<pb,orbit=new Float64Array((max+1)*2);let x=0n,y=0n,used=max;
 for(let n=1;n<=max;n++){const xx=(x*x)>>pb,yy=(y*y)>>pb;let xy=(x*y)>>pb;if(ship&&xy<0n)xy=-xy;x=xx-yy+cr;y=2n*xy+ci;orbit[2*n]=num(x,p);orbit[2*n+1]=num(y,p);if(x*x+y*y>256n*S*S){used=n;break;}}
 const ref={cr,ci,p,used,orbit:orbit.slice(0,2*(used+1)),radius,ship,levels:[],blocks:null};
 if(bla&&!ship&&radius<1e-10){ref.levels=buildBLA(ref,radius);ref.blocks=Array(used+1).fill(null);for(let l=ref.levels.length-1;l>=1;l--){const t=ref.levels[l],len=2**l;for(let k=0;k<t.length;k+=5){if(!(t[k+4]>0))continue;const m=k/5*len+1;let b=ref.blocks[m]||(ref.blocks[m]=[]);b.push(len,t[k],t[k+1],t[k+2],t[k+3],t[k+4]);}}ref.levels=[];}return ref;
}
// Balanced non-overlapping BLA tree. Radius is never squared (avoids underflow).
function buildBLA(ref,cmax){
 const levels=[],o=ref.orbit,n=ref.used-1;let prev=new Float64Array(n*5);
 for(let j=0;j<n;j++){let i=j+1,x=o[2*i],y=o[2*i+1],a=Math.hypot(x,y)*2,k=j*5;prev[k]=2*x;prev[k+1]=2*y;prev[k+2]=1;prev[k+4]=Math.hypot(x,y)<2?1e-12*a:0;}
 levels.push(prev);
 while(prev.length>=10){let count=Math.floor(prev.length/10),next=new Float64Array(count*5);
  for(let j=0;j<count;j++){let x=j*10,y=x+5,k=j*5,ar=prev[x],ai=prev[x+1],br=prev[x+2],bi=prev[x+3],cr=prev[y],ci=prev[y+1];next[k]=cr*ar-ci*ai;next[k+1]=cr*ai+ci*ar;next[k+2]=cr*br-ci*bi+prev[y+2];next[k+3]=cr*bi+ci*br+prev[y+3];let radius=Math.min(prev[x+4],(prev[y+4]-Math.hypot(br,bi)*cmax)/Math.hypot(ar,ai));next[k+4]=Number.isFinite(radius)?Math.max(0,radius):0;}
  levels.push(next);prev=next;
 }return levels;
}
function diffabs(a,b){return a>=0?(a+b>=0?b:-2*a-b):(a+b>0?2*a+b:-b);}
function perturb(dcx,dcy,max,ref,useBLA=true){
 const o=ref.orbit,blocks=useBLA&&Math.hypot(dcx,dcy)<=ref.radius?ref.blocks:null,ship=ref.ship;let x=0,y=0,m=0,n=0,error=0;
 while(n<max){
  let skip=0;
  if(blocks&&blocks[m]){
   const t=blocks[m],mag=Math.abs(x)+Math.abs(y);
   for(let k=0;k<t.length;k+=6){let len=t[k];if(n+len>max||mag>=t[k+5])continue;let nx=t[k+1]*x-t[k+2]*y+t[k+3]*dcx-t[k+4]*dcy;y=t[k+1]*y+t[k+2]*x+t[k+3]*dcy+t[k+4]*dcx;x=nx;skip=len;break;}
  }
  if(skip){m+=skip;n+=skip;}else{
   const X=o[2*m],Y=o[2*m+1],nx=2*(X*x-Y*y)+x*x-y*y+dcx;
   if(ship){const z=Math.abs(X+x)+Math.abs(Y+y),d=Math.abs(x)+Math.abs(y);error=2*(z+error)*error+8*Number.EPSILON*(d*(Math.abs(X)+Math.abs(Y)+d)+Math.abs(dcx)+Math.abs(dcy));if(error>1e-9)return NaN;}
   y=ship?2*diffabs(X*Y,X*y+Y*x+x*y)+dcy:2*(X*y+Y*x+x*y)+dcy;x=nx;m++;n++;
  }
  const X=o[2*m],Y=o[2*m+1],zx=X+x,zy=Y+y,r2=zx*zx+zy*zy;
  if(r2>256)return smooth(n,r2);
  if(!Number.isFinite(r2))return NaN;
  const zm=Math.max(Math.abs(zx),Math.abs(zy)),rm=Math.max(Math.abs(X),Math.abs(Y));
  // Severe cancellation is repaired from another high-precision reference, never painted black.
  if(rm>0&&zm<1e-8*rm)return NaN;
  if(ship&&((X!==0&&Math.abs(zx)<1e-3*Math.abs(X))||(Y!==0&&Math.abs(zy)<1e-3*Math.abs(Y))))return NaN;
  if(zm<Math.max(Math.abs(x),Math.abs(y))||m>=ref.used){if(ship)error+=Number.EPSILON*(rm+Math.abs(x)+Math.abs(y));x=zx;y=zy;m=0;}
 }return -1;
}
function tile(cfg,task){
 const {size,step,iter,formula,p,ref,juliaRe=-0.8,juliaIm=0.156}=cfg,ship=formula==='ship',julia=formula==='julia',values=new Float32Array(size*size);
 const cr=task.cr,ci=task.ci,stepF=parse(step.toExponential(17)),half=(size-1)/2,sign=ship?1:-1;
 const centerX=num(cr),centerY=num(ci),directMode=!ref;let glitches=[],repaired=0;
 if(directMode&&!ship&&!julia&&interiorRect(centerX,centerY,size*step/2)){values.fill(-1);return {values,repaired:0,uncertain:0};}
 const offX=ref?num(cr-(ref.cr<<BigInt(STORAGE_BITS-p))):0,offY=ref?num(ci-(ref.ci<<BigInt(STORAGE_BITS-p))):0;
 for(let y=0,q=0;y<size;y++)for(let x=0;x<size;x++,q++){
  const dx=(x-half)*step,dy=(y-half)*step*sign;
  let v=directMode?(julia?directJulia(centerX+dx,centerY+dy,iter,juliaRe,juliaIm):direct(centerX+dx,centerY+dy,iter,ship)):perturb(offX+dx,offY+dy,iter,ref,cfg.bla!==false);
  values[q]=v;if(Number.isNaN(v))glitches.push(q);
 }
 // One local reference per cluster, bounded; exact fallback keeps unresolved pixels honest.
 for(let pass=0;glitches.length&&pass<3;pass++){
  const seed=glitches[glitches.length>>1],sx=seed%size,sy=Math.floor(seed/size);
  const cx=cr+parse(((sx-half)*step).toExponential(17)),cy=ci+parse(((sy-half)*step*sign).toExponential(17));
  const r=reference(rescale(cx,p),rescale(cy,p),iter,p,ship,step*size*2,false),pending=[];
  for(const q of glitches){let dx=(q%size-sx)*step,dy=(Math.floor(q/size)-sy)*step*sign,v=perturb(dx,dy,iter,r,false);if(Number.isNaN(v))pending.push(q);else {values[q]=v;repaired++;}}
  glitches=pending;
 }
 let uncertain=0;
 for(const q of glitches){const x=q%size,y=Math.floor(q/size),cx=cr+parse(((x-half)*step).toExponential(17)),cy=ci+parse(((y-half)*step*sign).toExponential(17));values[q]=checkedExact(cx,cy,iter,p,ship);if(Number.isNaN(values[q]))uncertain++;else repaired++;}

function validate(re,im,span,iter,formula,juliaRe=state.juliaRe,juliaIm=state.juliaIm){let s=Number(span),it=Number(iter);if(!Number.isFinite(s)||s<F.MIN_SPAN||s>6)throw Error('Utsnitt må være mellom 1e-280 og 6');if(!Number.isInteger(it)||it<100||it>100000)throw Error('Bruk 100–100 000 iterasjoner');let r=F.parse(re),i=F.parse(im),f=formula==='ship'?'ship':formula==='julia'?'julia':'mandelbrot',jr=Number(juliaRe),ji=Number(juliaIm);if(Math.abs(F.num(r))>4||Math.abs(F.num(i))>4)throw Error('Senter må være innenfor ±4');if(!Number.isFinite(jr)||!Number.isFinite(ji)||Math.abs(jr)>4||Math.abs(ji)>4)throw Error('Julia-parameter må være innenfor ±4');return {re:r,im:i,span:s,iter:it,formula:f,juliaRe:jr,juliaIm:ji};}
function jump(re,im,span,iter,formula,juliaRe=state.juliaRe,juliaIm=state.juliaIm){try{const next=validate(re,im,span,iter,formula,juliaRe,juliaIm);interrupt();state=next;fit=null;colorVersion++;ui();render();}catch(e){$('status').textContent=e.message;}}
function autoFit(){let vals=[];if(!job)return;for(const k of job.keys){let t=cache.get(k);if(t)for(let i=0;i<t.values.length;i+=4)if(t.values[i]>=0)vals.push(t.values[i]);}if(vals.length<2){fit=null;return;}vals.sort((a,b)=>a-b);let lo=vals[Math.floor(vals.length*.01)],hi=vals[Math.floor(vals.length*.99)];if(hi<=lo){fit=null;return;}if(fitMode==='fit')fit=v=>.04+.88*Math.max(0,Math.min(1,(v-lo)/(hi-lo)));else {const quant=new Float32Array(1025);for(let i=0;i<=1024;i++)quant[i]=vals[Math.floor(i/1024*(vals.length-1))];fit=v=>{let a=0,b=1024;while(b-a>1){let m=(a+b)>>1;if(quant[m]<=v)a=m;else b=m;}return .04+.88*(a+(v-quant[a])/(quant[b]-quant[a]||1))/1024;};}colorVersion++;}
function recolor(){const t=performance.now();table=F.lut($('palette').value);colorVersion++;lastImage=null;draw();$('status').textContent=`Farger oppdatert · ${(performance.now()-t).toFixed(0)} ms · ingen ny iterasjon`;saveURL();}
const wrap=$('canvasWrap');wrap.addEventListener('wheel',e=>{e.preventDefault();zoom(e.clientX,e.clientY,Math.exp(Math.max(-150,Math.min(150,e.deltaY*(e.deltaMode===1?16:1)))*.0018*zoomSpeed));},{passive:false});wrap.addEventListener('dblclick',e=>zoom(e.clientX,e.clientY,.5));
const pointers=new Map();wrap.addEventListener('pointerdown',e=>{if(e.button!==0)return;interrupt();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});wrap.setPointerCapture(e.pointerId);gesture={...state};});
wrap.addEventListener('pointermove',e=>{let prev=pointers.get(e.pointerId);if(!prev)return;const r=viewer.getBoundingClientRect();if(pointers.size===2){let other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1];let before=Math.hypot(prev.x-other.x,prev.y-other.y),after=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(before>3&&after>3)zoom((e.clientX+other.x)/2,(e.clientY+other.y)/2,before/after);}else{move(-(e.clientX-prev.x)/r.width*state.span,(e.clientY-prev.y)/r.width*state.span*(state.formula==='ship'?-1:1));ui();drawSoon();schedule(100);}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});});
function endPointer(e){pointers.delete(e.pointerId);if(!pointers.size){gesture=null;schedule(0);}}wrap.addEventListener('pointerup',endPointer);wrap.addEventListener('pointercancel',endPointer);
viewer.addEventListener('keydown',e=>{let r=viewer.getBoundingClientRect();if(e.key==='+'||e.key==='='){zoom(r.left+r.width/2,r.top+r.height/2,.75);e.preventDefault();}else if(e.key==='-'){zoom(r.left+r.width/2,r.top+r.height/2,1.333);e.preventDefault();}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){interrupt();move((e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0)*state.span*.12,(e.key==='ArrowUp'?1:e.key==='ArrowDown'?-1:0)*state.span*.12*(state.formula==='ship'?-1:1));ui();drawSoon();schedule(0);e.preventDefault();}});
for(const [id,f]of [['zoomIn',.75],['zoomOut',1.333333]])$(id).onclick=()=>{let r=viewer.getBoundingClientRect();zoom(r.left+r.width/2,r.top+r.height/2,f);};
const zoomSpeeds=[1,2,4];$('zoomSpeedBtn').onclick=()=>{let i=zoomSpeeds.indexOf(zoomSpeed);zoomSpeed=zoomSpeeds[(i+1)%zoomSpeeds.length];$('zoomSpeedBtn').textContent='Zoomhastighet '+zoomSpeed+'×';};
function applyPosition(){let spanValue=$('spanInput').value;const z=Number($('zoomInput').value);if(document.activeElement===$('zoomInput')&&Number.isFinite(z)&&z>0)spanValue=(3.2/z).toExponential(17);jump($('reInput').value,$('imInput').value,spanValue,state.iter,$('formula').value,state.juliaRe,state.juliaIm);}
$('positionApply').onclick=applyPosition;
for(const id of ['reInput','imInput','zoomInput','spanInput'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyPosition();}});
$('zoomInput').addEventListener('change',()=>{const z=Number($('zoomInput').value);if(Number.isFinite(z)&&z>0)$('spanInput').value=(3.2/z).toExponential(17);});
$('spanInput').addEventListener('change',()=>{const s=Number($('spanInput').value);if(Number.isFinite(s)&&s>0)$('zoomInput').value=(3.2/s).toExponential(10);});
$('iterHintClose').onclick=e=>{e.preventDefault();e.stopPropagation();$('iterHint').hidden=true;iterHintActive=false;};
$('palette').onchange=recolor;$('density').oninput=()=>{$('densityOut').textContent=(+$('density').value).toFixed(2)+'×';recolor();};$('colors').onchange=()=>{fitMode=$('colors').value;fit=null;if(fitMode!=='classic')autoFit();recolor();};$('resolution').onchange=()=>schedule(0);$('pixelLimit').onchange=()=>schedule(0);$('juliaRe').onchange=$('juliaIm').onchange=()=>{if(state.formula==='julia')jump(position().re,position().im,state.span,state.iter,'julia',$('juliaRe').value,$('juliaIm').value);};
$('iterations').onchange=()=>jump(position().re,position().im,state.span,$('iterations').value,state.formula,state.juliaRe,state.juliaIm);
$('formula').onchange=()=>{const v=GALLERY.find(v=>v.formula===$('formula').value);jump(v.re,v.im,v.span,v.iter,v.formula,v.juliaRe,v.juliaIm);};
$('copyBtn').onclick=async()=>{saveURL();try{await navigator.clipboard.writeText(location.href);$('status').textContent='Lenke med presise koordinater kopiert';}catch(e){$('status').textContent='Posisjonen er lagret i adressefeltet';}};
$('homeBtn').onclick=()=>{let v=GALLERY.find(v=>v.formula===state.formula);jump(v.re,v.im,v.span,v.iter,v.formula,v.juliaRe,v.juliaIm);};
for(const v of GALLERY){let b=document.createElement('button');b.className='place';b.dataset.place=v.id;b.innerHTML='<strong>'+v.name+'</strong>';b.title=`Re ${v.re}\nIm ${v.im}\nUtsnitt ${v.span}\n${v.iter} iterasjoner`;b.onclick=()=>{if(v.id==='seahorse-satellite'){fitMode='fit';$('colors').value='fit';fit=null;colorVersion++;}jump(v.re,v.im,v.span,v.iter,v.formula,v.juliaRe,v.juliaIm);};$(v.formula==='ship'?'shipGallery':v.formula==='julia'?'juliaGallery':'mandelbrotGallery').append(b);}
addEventListener('resize',()=>{const r=viewer.getBoundingClientRect();if(Math.abs(r.width-measuredWidth)>.5||Math.abs(r.height-measuredHeight)>.5)schedule(150);});addEventListener('pagehide',()=>{pool.forEach(s=>s.worker.terminate());refWorker?.terminate();URL.revokeObjectURL(workerURL);});
addEventListener('hashchange',()=>{try{const q=new URLSearchParams(location.hash.slice(1));if(q.has('re'))jump(q.get('re'),q.get('im'),q.get('span'),Number(q.get('iter')),q.get('formula'),q.get('juliaRe')??state.juliaRe,q.get('juliaIm')??state.juliaIm);}catch(e){$('status').textContent=e.message;}});
try{const q=new URLSearchParams(location.hash.slice(1));if(q.has('re')){state=validate(q.get('re'),q.get('im'),q.get('span'),q.get('iter'),q.get('formula'),q.get('juliaRe')??state.juliaRe,q.get('juliaIm')??state.juliaIm);if(q.has('palette')&&['classic','fire','ocean','psychedelic','whitered','greenpink','bw'].includes(q.get('palette')))$('palette').value=q.get('palette');if(q.has('density'))$('density').value=Math.max(.35,Math.min(4,Number(q.get('density'))||1.35));if(q.has('pixelLimit')){const px=Number(q.get('pixelLimit'))||1600000;const allowed=[1000000,1600000,2000000,3000000];$('pixelLimit').value=allowed.reduce((a,b)=>Math.abs(b-px)<Math.abs(a-px)?b:a,1600000);}if(['classic','fit','histogram'].includes(q.get('colors'))){fitMode=q.get('colors');$('colors').value=fitMode;}}}catch(e){$('status').textContent='Ugyldig posisjon i lenken: '+e.message;}
table=F.lut($('palette').value);ui();render();
})();
